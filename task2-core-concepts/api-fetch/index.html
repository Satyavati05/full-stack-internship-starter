<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
</head>

<body>

    <h1>Student Management System</h1>

    <h2>Add Student</h2>

    <form id="studentForm">

        <input
            type="text"
            id="firstName"
            placeholder="First Name"
            required
        >

        <input
            type="text"
            id="lastName"
            placeholder="Last Name"
            required
        >

        <input
            type="text"
            id="course"
            placeholder="Course"
            required
        >

        <input
            type="number"
            id="age"
            placeholder="Age"
            required
        >

        <button type="submit" id="submitButton">Add Student</button>
    </form>

    <p id="message"></p>

    <h2>Student List</h2>

    <div id="studentList"></div>

    <script src="script.js"></script>

</body>
</html>
